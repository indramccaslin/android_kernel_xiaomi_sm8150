name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev \
            libelf-dev build-essential zip unzip wget curl python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git

      - name: Download Clang
        run: |
          mkdir -p $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang
          echo "PATH=$HOME/clang/bin:$PATH" >> $GITHUB_ENV
          echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out vendor/sm8150_defconfig vendor/xiaomi/cepheus.config
          make O=out -j$(nproc) 2>&1 | tail -30

      - name: Package
        run: |
          mkdir -p AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3 && zip -r ../kernel-cepheus.zip . 2>/2 || true
          cp out/arch/arm64/boot/Image.gz-dtb kernel-cepheus.zip 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-cepheus
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            kernel-cepheus.zip
