name: Build Kernel
on:
  workflow_dispatch:
  push:
    branches: [17-ksun]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev libelf-dev build-essential zip wget curl python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clang
        run: |
          mkdir -p $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out vendor/sm8150_defconfig vendor/xiaomi/cepheus.config
          make O=out -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ksun-susfs
          path: out/arch/arm64/boot/Image.gz-dtb
