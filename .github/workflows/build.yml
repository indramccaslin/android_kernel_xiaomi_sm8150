name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev \
            libelf-dev build-essential zip unzip wget curl python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download toolchain
        run: |
          mkdir -p toolchain
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230928-release/Clang-17.0.0-20230928.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchain
          echo "CLANG_PATH=$PWD/toolchain/clang-17" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          export PATH=$CLANG_PATH/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out vendor/sm8150_defconfig vendor/xiaomi/cepheus.config
          make O=out -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tail -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image
