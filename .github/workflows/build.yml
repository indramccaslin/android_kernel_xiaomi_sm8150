name: Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev libelf-dev build-essential zip wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: clang
        run: wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz && tar -xf clang-r450784d.tar.gz
      - name: build
        run: |
          export PATH=$PWD/bin:$PATH ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out vendor/sm8150_defconfig vendor/xiaomi/cepheus.config
          make O=out -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/arch/arm64/boot/Image.gz-dtb
